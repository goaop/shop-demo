; OPcache settings of the production-style image (see docs/performance.md of goaop/framework)
opcache.enable=1
; the built-in web server of the demo is a CLI SAPI
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; immutable image: never stat the files again
opcache.validate_timestamps=0
; the AOP cache is written atomically (tmp + rename): freshly woven files can be cached at once
opcache.file_update_protection=0
; primed at build time by docker/opcache-prime.php
opcache.file_cache=/var/cache/opcache
opcache.file_cache_consistency_checks=0
; nothing is compiled at runtime that the image does not already have: works with a read-only root file system
opcache.file_cache_read_only=1
; PHP 8.5.11 / 8.5.12: the tracing JIT has a bug of its own
opcache.jit=disable
; links the woven classes into shared memory at server start
opcache.preload=/app/config/preload.php
opcache.preload_user=www-data
